name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pinned: validate output changes between releases. Bump on purpose.
      - run: npm install -g @anthropic-ai/claude-code@2.1.312
      - name: Each plugin, warnings as errors
        run: for p in plugins/*/; do claude plugin validate --strict "$p" || exit 1; done
      - name: Marketplace
        # --strict fails an empty plugin list: strict once the first entry lands.
        run: |
          if jq -e '.plugins | length > 0' .claude-plugin/marketplace.json >/dev/null; then
            claude plugin validate --strict .
          else
            claude plugin validate .
          fi
      - name: SKILL.md version matches plugin.json
        # Single-skill plugins only: casebook ships two skills, versioned by plugin.json alone.
        run: |
          for m in plugins/*/.claude-plugin/plugin.json; do
            d=${m%/.claude-plugin/plugin.json}; n=$(jq -r .name "$m")
            s="$d/skills/$n/SKILL.md"
            [ -f "$s" ] || continue
            sv=$(sed -n 's/^version: *//p' "$s" | head -1); pv=$(jq -r .version "$m")
            [ "$sv" = "$pv" ] || { echo "$n: SKILL.md $sv != plugin.json $pv"; exit 1; }
          done
